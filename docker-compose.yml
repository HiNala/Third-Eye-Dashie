services:
  # ── PostgreSQL + pgvector ──────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tickets_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Backend – FastAPI sentiment engine ─────────────────────────
  backend:
    build:
      context: ./ticket-sentiment-engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/tickets_db
    env_file:
      - path: ./ticket-sentiment-engine/.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend – Next.js dashboard ───────────────────────────────
  frontend:
    build:
      context: ./customer-ticket-dashboard
      dockerfile: Dockerfile
      args:
        # Browser hits localhost:8000 which is port-mapped to the backend container
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_USE_MOCK: "false"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
